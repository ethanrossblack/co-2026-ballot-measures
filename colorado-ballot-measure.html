<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colorado ballot measure results by county</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef0ea;
    --ink: #22302a;
    --muted: #5d6b63;
    --line: #2f4a3a;
    --yes: #5f9a94;
    --yes-2: #74aba5;
    --no: #c49a4a;
    --no-2: #d1ab62;
    --active: #2d3b45;
    --hover-bg: #dfe3da;
    --rule: #d5dacf;
    --bar-ink: #16221c;
    --pad: clamp(1rem, 3vw, 2rem);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #18201c;
      --ink: #e4e9e3;
      --muted: #9aa89f;
      --line: #a9c3b0;
      --yes: #3f7a74;
      --yes-2: #4b8a83;
      --no: #97733a;
      --no-2: #a88346;
      --active: #eef0ea;
      --hover-bg: #222c27;
      --rule: #2c3731;
      --bar-ink: #f4f6f2;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font: 400 1rem/1.4 "Barlow", system-ui, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: .75rem 2rem;
    padding: 1rem var(--pad) .5rem;
  }
  h1 {
    font: 600 clamp(1.4rem, 3vw, 2rem)/1.1 "Barlow Condensed", "Barlow", sans-serif;
    margin: 0;
  }
  header p { margin: .2rem 0 0; color: var(--muted); font-size: .95rem; max-width: 70ch; }
  .controls { display: flex; flex-wrap: wrap; gap: .5rem; margin-left: auto; }
  button {
    font: 600 .9rem "Barlow", system-ui, sans-serif;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: .4rem .8rem;
    cursor: pointer;
  }
  button:hover { background: var(--hover-bg); }
  button:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
  #gravity[aria-pressed="false"] { color: var(--muted); border-style: dashed; }
  .measure-ctl { display: flex; align-items: center; gap: .5rem; font: 600 .9rem "Barlow", system-ui, sans-serif; }
  .measure-ctl select {
    font: inherit; color: var(--ink); background: transparent;
    border: 1.5px solid var(--line); border-radius: 6px; padding: .35rem .5rem; max-width: 16rem;
  }
  .size-ctl { display: flex; align-items: center; gap: .5rem; font: 600 .9rem "Barlow", system-ui, sans-serif; }
  .size-ctl input { width: 8rem; accent-color: var(--ink); }
  .size-ctl output { min-width: 3ch; color: var(--muted); font-variant-numeric: tabular-nums; }
  #msg { padding: 0 var(--pad); color: var(--muted); font-size: .9rem; min-height: 1.3em; }
  .stages {
    flex: none;
    height: max(420px, calc(100vh - 10rem));
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--pad);
    padding: .25rem var(--pad) var(--pad);
    min-height: 0;
  }
  .side { display: flex; flex-direction: column; min-height: 0; }
  .side-head { display: flex; align-items: baseline; gap: .75rem; margin-bottom: .4rem; }
  .side-head h2 {
    font: 600 1.5rem/1 "Barlow Condensed", "Barlow", sans-serif;
    margin: 0;
  }
  .side-head .swatch { width: .8rem; height: .8rem; border-radius: 2px; align-self: center; }
  .side[data-side="yes"] .swatch { background: var(--yes); }
  .side[data-side="no"] .swatch { background: var(--no); }
  .side-head .total { color: var(--muted); font-variant-numeric: tabular-nums; }
  .stage {
    flex: 1;
    position: relative;
    min-height: 320px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  /* Heading, search/sort bar and table share one column, centered once the window is wider than it */
  .table-section {
    width: 100%;
    max-width: calc(58rem + 2 * var(--pad));
    margin: 0 auto;
    padding: .5rem var(--pad) calc(var(--pad) * 1.5);
  }
  .table-section h2 {
    font: 600 1.5rem/1 "Barlow Condensed", "Barlow", sans-serif;
    margin: 0 0 .6rem;
  }
  table { width: 100%; max-width: 58rem; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: .4rem .75rem; text-align: left; border-bottom: 1px solid var(--rule); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .table-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; margin-bottom: .75rem; }
  #county-search {
    width: min(20rem, 100%);
    font: 400 .95rem "Barlow", system-ui, sans-serif;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: .4rem .7rem;
  }
  #county-search::placeholder { color: var(--muted); }
  #county-search:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
  .sort-pick { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .9rem; }
  #sort-select {
    font: 400 .95rem "Barlow", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: .4rem .6rem;
    cursor: pointer;
  }
  #sort-select:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
  #table-count { color: var(--muted); font-size: .9rem; }
  td.empty { text-align: center; color: var(--muted); padding: 1.25rem .75rem; border-left: none; }
  th + th, td + td { border-left: 1px solid var(--rule); }
  th.num, td.num { text-align: right; }
  td.name { cursor: default; }
  thead th {
    position: sticky; top: 0;
    background: var(--paper);
    border-bottom: 1.5px solid var(--line);
    padding-top: .6rem;
  }
  tbody tr:hover { background: var(--hover-bg); }
  tfoot td { font-weight: 600; border-top: 1.5px solid var(--line); border-bottom: none; }
  .table-section button.sort-btn {
    display: flex; align-items: center; gap: .4rem; width: 100%;
    padding: 0; border: 0; border-radius: 0; background: none;
    font: 600 .95rem "Barlow", system-ui, sans-serif; color: var(--ink);
  }
  .table-section button.sort-btn:hover { background: none; text-decoration: underline; }
  th.num .sort-btn { justify-content: flex-end; }
  th.ctr .sort-btn { justify-content: center; }
  .sw { display: inline-block; width: .6rem; height: .6rem; border-radius: 2px; }
  .sw.yes { background: var(--yes); }
  .sw.no { background: var(--no); }
  td.split-cell { width: 52%; padding-top: .3rem; padding-bottom: .3rem; }
  .split-wrap { display: flex; flex-direction: column; gap: .2rem; }
  .split { display: flex; height: 1.35rem; border-radius: 4px; overflow: hidden; background: var(--rule); }
  .seg {
    display: flex; align-items: center; padding: 0 .4rem;
    font-size: .8rem; font-weight: 600; color: var(--bar-ink);
    white-space: nowrap; overflow: hidden;
  }
  .split-counts {
    display: flex; justify-content: space-between;
    font-size: .8rem; line-height: 1.1; color: var(--muted);
  }
  .seg.yes { background: var(--yes); justify-content: flex-start; }
  .seg.no { background: var(--no); justify-content: flex-end; }
  .arrow { display: inline-block; width: .9em; font-size: .75em; color: var(--muted); }
  .arrow::after { content: "\2195"; opacity: .45; }
  .sort-btn[data-sort="asc"] .arrow::after { content: "\25B2"; opacity: 1; color: var(--ink); }
  .sort-btn[data-sort="desc"] .arrow::after { content: "\25BC"; opacity: 1; color: var(--ink); }
  /* Margin: bold number, cell filled with the leading side's color */
  td.margin-cell {
    text-align: center; font-weight: 400; color: var(--bar-ink); white-space: nowrap;
    padding-top: .3rem; padding-bottom: .3rem;
  }
  .margin-main { height: 1.35rem; display: flex; align-items: center; justify-content: center; }
  .margin-main { font-weight: 700; }
  .margin-main span { white-space: pre; }
  .margin-sub { margin-top: .2rem; font-size: .8rem; font-weight: 400; line-height: 1.1; }
  td.margin-cell strong { font-weight: 700; }
  td.margin-cell.yes { background: var(--yes); }
  td.margin-cell.no { background: var(--no); }
  td.margin-cell.even { color: var(--muted); }
  /* Total: count on the bar's line, share of state on the counts' line */
  td.total-cell { padding-top: .3rem; padding-bottom: .3rem; }
  .total-main { height: 1.35rem; display: flex; align-items: center; justify-content: flex-end; }
  .total-sub { margin-top: .2rem; font-size: .8rem; font-weight: 400; line-height: 1.1; color: var(--muted); }
  .split-sorts { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .table-section .split-sorts button.sort-btn { width: auto; }
  @media (max-width: 760px) {
    .stages { grid-template-columns: 1fr; height: auto; }
    .stage { min-height: 65vh; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1 id="title">Ballot measure results</h1>
      <p>Each county’s area is proportional to its votes. Both sides share one scale, so the total area on each side reflects that side’s total votes. Drag counties around.</p>
      <p id="snapshot-note"></p>
    </div>
    <div class="controls">
      <label class="measure-ctl">
        Measure
        <select id="measure" aria-label="Ballot measure" disabled></select>
      </label>
      <label class="size-ctl" title="Scale every county shape; re-drops the counties when released">
        Size
        <input id="size" type="range" min="0.5" max="1.5" step="0.05" value="1" aria-label="Shape size">
        <output id="size-out" for="size">100%</output>
      </label>
      <button id="drop" type="button">Drop again</button>
      <button id="shake" type="button">Shake</button>
      <button id="shape" type="button" aria-pressed="true">Show map shapes</button>
      <button id="gravity" type="button" aria-pressed="true">Gravity on</button>
    </div>
  </header>
  <div id="msg" role="status"></div>
  <main class="stages">
    <section class="side" data-side="yes">
      <div class="side-head"><span class="swatch"></span><h2>Yes</h2><span class="total" id="total-yes"></span></div>
      <div class="stage"><canvas aria-label="Yes votes by county"></canvas></div>
    </section>
    <section class="side" data-side="no">
      <div class="side-head"><span class="swatch"></span><h2>No</h2><span class="total" id="total-no"></span></div>
      <div class="stage"><canvas aria-label="No votes by county"></canvas></div>
    </section>
  </main>
  <section class="table-section" aria-labelledby="table-title">
    <h2 id="table-title">Results by county</h2>
    <div class="table-tools">
      <label for="county-search" class="sr-only">Search counties</label>
      <input id="county-search" type="search" placeholder="Search counties" autocomplete="off">
      <label class="sort-pick">Sort by
        <select id="sort-select"></select>
      </label>
      <span id="table-count" aria-live="polite"></span>
    </div>
    <table id="results-table">
      <thead>
        <tr>
          <th scope="col" aria-sort="none"><button type="button" class="sort-btn" data-key="name">County<span class="arrow" aria-hidden="true"></span></button></th>
          <th scope="col" class="split-head" aria-sort="none">
            <div class="split-sorts">
              <button type="button" class="sort-btn" data-key="yes" title="Sort by Yes votes"><span class="sw yes"></span>Yes<span class="arrow" aria-hidden="true"></span></button>
              <button type="button" class="sort-btn" data-key="share" title="Sort by the Yes share of the vote">% Yes<span class="arrow" aria-hidden="true"></span></button>
              <button type="button" class="sort-btn" data-key="no" title="Sort by No votes"><span class="sw no"></span>No<span class="arrow" aria-hidden="true"></span></button>
            </div>
          </th>
          <th scope="col" class="ctr" aria-sort="none"><button type="button" class="sort-btn" data-key="margin" title="Net margin in percentage points: Yes share minus No share. Sorts from the biggest Yes lead to the biggest No lead.">Margin<span class="arrow" aria-hidden="true"></span></button></th>
          <th scope="col" class="num" aria-sort="none"><button type="button" class="sort-btn" data-key="total" title="County total votes, with its share of the statewide total underneath">Total<span class="arrow" aria-hidden="true"></span></button></th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot></tfoot>
    </table>
  </section>

<script>
const CONFIG = {
  fillRatio: 0.40,       // share of a stage covered by the larger side's counties
  simplifyPx: 0.8,       // collision-shape simplification tolerance, px
  minLabelPx: 46,        // label counties whose smaller side is at least this
  dropIntervalMs: 70,
  // restitution 0 = no bounce; slop = allowed overlap before correction (higher = less jitter)
  body: { friction: 0.6, frictionStatic: 1, frictionAir: 0.02, restitution: 0, slop: 0.1 },
  shakeStrength: 1,
  morphMs: 550,          // duration of the outline <-> circle animation
  morphPoints: 64        // points each shape is resampled to for the animation
};

const { Engine, Runner, Bodies, Body, Composite, Mouse, MouseConstraint, Query, Vertices, Common, Events, Sleeping } = Matter;
Common.setDecomp(decomp);

let shapeMode = "circle"; // "circle" = equal-area circle (default), "map" = county outline
const fmt = d3.format(",");
const pct = d3.format(".1%");
// Same wording wherever a county is called out on a canvas
const countyLabel = (name, side, votes, share) =>
  `${name} County: ${fmt(votes)} ${side} votes (${pct(share)} of county)`;
const normName = s => String(s ?? "").toLowerCase().replace(/\s+county$/, "").replace(/[^a-z]/g, "");
const ringArea = r => Math.abs(d3.polygonArea(r));
const msg = text => (document.getElementById("msg").textContent = text);

// ---------- County geometry (once) ----------

function loadCounties() {
  const topo = JSON.parse(document.getElementById("colorado-topo").textContent);
  const fc = topojson.feature(topo, topo.objects["colorado-counties"]);
  const projection = d3.geoConicEqualArea()
    .parallels([37.5, 40.5]).rotate([105.5, 0]).fitSize([1000, 1000], fc);
  const path = d3.geoPath(projection);
  return fc.features.map(f => {
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    const rings = polys.map(poly => poly.map(ring => ring.slice(0, -1).map(projection)));
    return { id: f.id, name: f.properties.name, key: normName(f.properties.name), rings, projArea: path.area(f) };
  });
}
const COUNTIES = loadCounties();
const COUNTY_BY_KEY = new Map(COUNTIES.map(c => [c.key, c]));
const COUNTY_BY_ID = new Map(COUNTIES.map(c => [c.id, c]));

// ---------- Ballot measure results ----------

// Builds the results object the page works from out of one ballot measure in
// data/ballot-measures.json: { byId, totals, unmatched, missing }
function measureToResults(measure) {
  const byId = new Map();
  const unmatched = [];
  for (const [name, v] of Object.entries(measure.counties)) {
    const c = COUNTY_BY_KEY.get(normName(name));
    if (!c) { unmatched.push(name); continue; }
    byId.set(c.id, { yes: v.yes, no: v.no });
  }
  if (!byId.size) throw new Error("No rows matched a Colorado county name.");
  const totals = {
    yes: d3.sum(byId.values(), d => d.yes),
    no: d3.sum(byId.values(), d => d.no)
  };
  return { byId, totals, unmatched, missing: COUNTIES.filter(c => !byId.has(c.id)).map(c => c.name) };
}

// ---------- Results table ----------

const tableState = { key: "name", dir: "asc" };
let tableRows = [];
let tableHoverId = null; // county id under the pointer in the table, if any
let tableQuery = "";     // lowercase search text

// Every sort the dropdown offers: the column-header sorts, plus two extra measures
const SORT_GROUPS = [
  ["Table columns", [
    ["name", "asc", "County (A to Z)"], ["name", "desc", "County (Z to A)"],
    ["yes", "desc", "Yes votes (most first)"], ["yes", "asc", "Yes votes (fewest first)"],
    ["no", "desc", "No votes (most first)"], ["no", "asc", "No votes (fewest first)"],
    ["share", "desc", "% Yes (highest first)"], ["share", "asc", "% Yes (lowest first)"],
    ["margin", "desc", "Margin (biggest Yes lead first)"], ["margin", "asc", "Margin (biggest No lead first)"],
    ["total", "desc", "Total votes (most first)"], ["total", "asc", "Total votes (fewest first)"]
  ]],
  ["Other measures", [
    ["absMargin", "asc", "Closest races first"], ["absMargin", "desc", "Widest margins first"],
    ["diff", "desc", "Vote differential (largest first)"], ["diff", "asc", "Vote differential (smallest first)"]
  ]]
];
const sortSelect = document.getElementById("sort-select");
for (const [label, options] of SORT_GROUPS) {
  const group = document.createElement("optgroup");
  group.label = label;
  for (const [key, dir, text] of options) {
    const opt = document.createElement("option");
    opt.value = `${key}:${dir}`;
    opt.textContent = text;
    group.append(opt);
  }
  sortSelect.append(group);
}

function td(text, cls) {
  const el = document.createElement("td");
  el.textContent = text;
  if (cls) el.className = cls;
  return el;
}

// Small shares need two decimals so San Juan reads 0.02% rather than 0.0%
const fmtShare = p => d3.format(p < 0.01 ? ".2%" : ".1%")(p);

// One rectangle split into Yes and No segments, each as wide as its share of the votes.
// Percentages sit inside the segments; vote counts sit beneath, under their own side.
function splitBar(name, yes, no) {
  const all = yes + no;
  const ys = all ? yes / all : 0, ns = all ? no / all : 0;
  const wrap = document.createElement("div");
  wrap.className = "split-wrap";
  wrap.setAttribute("role", "img");
  const summary = `${name}: Yes ${fmt(yes)} (${pct(ys)}), No ${fmt(no)} (${pct(ns)})`;
  wrap.setAttribute("aria-label", summary);
  wrap.title = summary;
  const bar = document.createElement("div");
  bar.className = "split";
  const counts = document.createElement("div");
  counts.className = "split-counts";
  for (const [cls, votes, share] of [["yes", yes, ys], ["no", no, ns]]) {
    const seg = document.createElement("span");
    seg.className = `seg ${cls}`;
    seg.style.width = `${share * 100}%`;
    const lab = document.createElement("span");
    lab.className = "lab";
    lab.textContent = pct(share);
    seg.append(lab);
    bar.append(seg);
    const count = document.createElement("span");
    count.textContent = fmt(votes);
    counts.append(count);
  }
  wrap.append(bar, counts);
  return wrap;
}

// Hide a percentage label when its segment is too narrow to hold it
function fitSegLabels() {
  document.querySelectorAll("#results-table .seg").forEach(seg => {
    const lab = seg.firstElementChild;
    const cs = getComputedStyle(seg);
    const room = seg.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    lab.style.visibility = lab.offsetWidth > room ? "hidden" : "";
  });
}

// Net margin in percentage points, e.g. "+3.1 Yes" or "+14.0 No"; m = (yes - no) / (yes + no)
function fmtMargin(m) {
  const pts = Math.abs(m) * 100;
  if (pts < 0.005) return { num: "", word: "Even", cls: "even" };
  let num = pts.toFixed(1);
  if (num === "0.0") num = pts.toFixed(2); // keep a tiny lead from reading as zero
  return { num: `+${num}`, word: m > 0 ? "Yes" : "No", cls: m > 0 ? "yes" : "no" };
}

// Bold number, cell filled with the color of the leading side,
// with the raw vote differential in smaller text underneath
function tdMargin(yes, no) {
  const all = yes + no;
  const { num, word, cls } = fmtMargin(all ? (yes - no) / all : 0);
  const diff = Math.abs(yes - no);
  const el = document.createElement("td");
  el.className = `margin-cell ${cls}`;
  const main = document.createElement("div");
  main.className = "margin-main";
  if (num) {
    const strong = document.createElement("strong");
    strong.textContent = num;
    // Own element with preserved whitespace: a flex container would swallow a bare leading space
    const label = document.createElement("span");
    label.textContent = ` ${word}`;
    main.append(strong, label);
  } else {
    main.textContent = word;
  }
  const sub = document.createElement("div");
  sub.className = "margin-sub";
  sub.textContent = fmt(diff);
  el.title = diff ? `${word} leads by ${fmt(diff)} ${diff === 1 ? "vote" : "votes"}` : "Tied";
  el.append(main, sub);
  return el;
}

// County total, with its share of the statewide total in smaller text underneath
function tdTotal(total, share) {
  const el = document.createElement("td");
  el.className = "num total-cell";
  el.title = `${fmtShare(share)} of the statewide total`;
  const main = document.createElement("div");
  main.className = "total-main";
  main.textContent = fmt(total);
  const sub = document.createElement("div");
  sub.className = "total-sub";
  sub.textContent = fmtShare(share);
  el.append(main, sub);
  return el;
}

function tdBar(name, yes, no) {
  const el = document.createElement("td");
  el.className = "split-cell";
  el.append(splitBar(name, yes, no));
  return el;
}

function renderTable() {
  const { key, dir } = tableState;
  const sign = dir === "asc" ? 1 : -1;
  // Substring match on county name, plus a space-insensitive prefix match
  // so "elpaso" finds "El Paso" without "san" matching "Las Animas"
  const q = tableQuery, qCompact = q.replace(/\s+/g, "");
  const matches = r => {
    const n = r.name.toLowerCase();
    return !q || n.includes(q) || n.replace(/\s+/g, "").startsWith(qCompact);
  };
  const rows = tableRows.filter(matches).sort((a, b) => {
    const d = key === "name" ? a.name.localeCompare(b.name) : a[key] - b[key];
    return sign * d || a.name.localeCompare(b.name); // ties fall back to name
  });
  const body = rows.map(r => {
    const tr = document.createElement("tr");
    tr.dataset.id = r.id;
    tr.append(td(r.name, "name"), tdBar(r.name, r.yes, r.no), tdMargin(r.yes, r.no),
      tdTotal(r.total, r.pctState));
    return tr;
  });
  if (!rows.length) {
    const tr = document.createElement("tr");
    const cell = td(`No counties match \u201c${document.getElementById("county-search").value.trim()}\u201d`, "empty");
    cell.colSpan = 4;
    tr.append(cell);
    body.push(tr);
  }
  document.querySelector("#results-table tbody").replaceChildren(...body);
  document.getElementById("table-count").textContent = tableQuery
    ? `${rows.length} of ${tableRows.length} counties`
    : `${tableRows.length} counties`;
  // Arrows live on each button; a header cell reports aria-sort if one of its buttons is active
  document.querySelectorAll("#results-table .sort-btn").forEach(btn => {
    btn.dataset.sort = btn.dataset.key === key ? dir : "none";
  });
  document.querySelectorAll("#results-table thead th").forEach(th => {
    const active = th.querySelector(`.sort-btn[data-key="${key}"]`);
    th.setAttribute("aria-sort", active ? (dir === "asc" ? "ascending" : "descending") : "none");
  });
  sortSelect.value = `${key}:${dir}`; // keep the dropdown in step with header clicks
  fitSegLabels();
}

function setTableData(res) {
  const grand = res.totals.yes + res.totals.no; // statewide total
  tableRows = COUNTIES.filter(c => res.byId.has(c.id)).map(c => {
    const { yes, no } = res.byId.get(c.id);
    const total = yes + no;
    return {
      id: c.id, name: c.name, yes, no, total,
      share: total ? yes / total : 0,          // Yes share within the county
      margin: total ? (yes - no) / total : 0,  // + favors Yes, - favors No
      absMargin: total ? Math.abs(yes - no) / total : 0, // size of the lead, either side
      diff: Math.abs(yes - no),                // raw vote differential
      pctState: grand ? total / grand : 0      // county total as a share of the statewide total
    };
  });
  const tr = document.createElement("tr");
  tr.append(td("Statewide"), tdBar("Statewide", res.totals.yes, res.totals.no),
    tdMargin(res.totals.yes, res.totals.no), tdTotal(grand, grand ? 1 : 0));
  document.querySelector("#results-table tfoot").replaceChildren(tr);
  renderTable();
}

document.querySelector("#results-table thead").addEventListener("click", e => {
  const btn = e.target.closest(".sort-btn");
  if (!btn) return;
  const key = btn.dataset.key;
  if (tableState.key === key) tableState.dir = tableState.dir === "asc" ? "desc" : "asc";
  else { tableState.key = key; tableState.dir = key === "name" ? "asc" : "desc"; }
  renderTable();
});

sortSelect.addEventListener("change", () => {
  const [key, dir] = sortSelect.value.split(":");
  tableState.key = key;
  tableState.dir = dir;
  tableHoverId = null; // rows are about to be rebuilt
  renderTable();
});

document.getElementById("county-search").addEventListener("input", e => {
  tableQuery = e.target.value.trim().toLowerCase();
  tableHoverId = null; // rows are about to be rebuilt
  renderTable();
});

// Web fonts change text widths, so re-check which labels fit once they load
document.fonts?.ready.then(fitSegLabels);

// Hovering anywhere on a county's row highlights that county in both containers
const tbody = document.querySelector("#results-table tbody");
tbody.addEventListener("mouseover", e => {
  const row = e.target.closest("tr[data-id]");
  tableHoverId = row ? row.dataset.id : null;
});
tbody.addEventListener("mouseleave", () => (tableHoverId = null));
// Re-sorting rebuilds the rows under a stationary pointer, so drop any stale hover
document.querySelector("#results-table thead").addEventListener("mouseenter", () => (tableHoverId = null));

// ---------- Shape helpers ----------

// Douglas–Peucker on an open ring of [x, y] points
function simplify(points, tol) {
  if (points.length < 8) return points;
  const keep = new Uint8Array(points.length);
  keep[0] = keep[points.length - 1] = 1;
  const stack = [[0, points.length - 1]];
  const t2 = tol * tol;
  while (stack.length) {
    const [a, b] = stack.pop();
    const [ax, ay] = points[a], [bx, by] = points[b];
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy || 1;
    let maxD = 0, idx = -1;
    for (let i = a + 1; i < b; i++) {
      const [px, py] = points[i];
      const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
      const ex = ax + t * dx - px, ey = ay + t * dy - py;
      const d = ex * ex + ey * ey;
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (maxD > t2) { keep[idx] = 1; stack.push([a, idx], [idx, b]); }
  }
  const out = points.filter((_, i) => keep[i]);
  return out.length >= 3 ? out : points;
}

// Resample a closed ring to n points spaced evenly along its perimeter
function resample(ring, n) {
  const pts = ring.concat([ring[0]]);
  const seg = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    seg.push(d); total += d;
  }
  const out = [];
  let i = 0, acc = 0;
  for (let j = 0; j < n; j++) {
    const target = (j / n) * total;
    while (i < seg.length - 1 && acc + seg[i] < target) acc += seg[i++];
    const t = seg[i] ? (target - acc) / seg[i] : 0;
    out.push([pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]);
  }
  return out;
}

// Reorder `to` so its points travel the least distance from `from`:
// same winding, best starting index
function alignTo(from, to) {
  const area = r => d3.polygonArea(r);
  if (Math.sign(area(from)) !== Math.sign(area(to))) to = to.slice().reverse();
  let best = to, bestD = Infinity;
  for (let k = 0; k < to.length; k++) {
    let d = 0;
    for (let i = 0; i < from.length; i++) {
      const q = to[(i + k) % to.length];
      d += (from[i][0] - q[0]) ** 2 + (from[i][1] - q[1]) ** 2;
      if (d >= bestD) break;
    }
    if (d < bestD) { bestD = d; best = to.slice(k).concat(to.slice(0, k)); }
  }
  return best;
}

const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

// A county scaled so its area = value * k px², as a Matter body.
// mode "map" keeps the outline; "circle" uses a circle of the same area.
function buildCountyBody(c, value, k, mode = shapeMode) {
  if (mode === "circle") {
    const r = Math.sqrt((value * k) / Math.PI);
    const body = Bodies.circle(0, 0, r, { ...CONFIG.body });
    const path = new Path2D();
    path.arc(0, 0, r, 0, Math.PI * 2);
    const n = CONFIG.morphPoints;
    const morphPts = d3.range(n).map(i => [r * Math.cos((i / n) * 2 * Math.PI), r * Math.sin((i / n) * 2 * Math.PI)]);
    body.county = { id: c.id, name: c.name, value, path, offset: { x: 0, y: 0 }, w: 2 * r, h: 2 * r, mode, morphPts };
    return body;
  }

  const s = Math.sqrt((value * k) / c.projArea);
  const rings = c.rings.map(poly => poly.map(ring => ring.map(([x, y]) => [x * s, y * s])));

  const path = new Path2D();
  for (const poly of rings) for (const ring of poly) {
    path.moveTo(ring[0][0], ring[0][1]);
    for (let i = 1; i < ring.length; i++) path.lineTo(ring[i][0], ring[i][1]);
    path.closePath();
  }

  const outer = rings.map(p => p[0]).sort((a, b) => ringArea(b) - ringArea(a))[0];
  const pts = simplify(outer, CONFIG.simplifyPx).map(([x, y]) => ({ x, y }));
  const polyArea = ringArea(outer);
  const clone = () => pts.map(p => ({ x: p.x, y: p.y }));

  let body = null;
  if (polyArea > 250 && !Vertices.isConvex(clone())) {
    try { body = Bodies.fromVertices(0, 0, [clone()], { ...CONFIG.body }, true, 0.01, 1); } catch { body = null; }
    const partsArea = body ? (body.parts.length > 1 ? d3.sum(body.parts.slice(1), p => p.area) : body.area) : 0;
    if (partsArea < 0.85 * polyArea) body = null;
  }
  if (!body) body = Bodies.fromVertices(0, 0, [Vertices.hull(clone())], { ...CONFIG.body });

  // Offset from the body's centre of mass to the outline's coordinate frame
  const minX = d3.min(pts, p => p.x), minY = d3.min(pts, p => p.y);
  const maxX = d3.max(pts, p => p.x), maxY = d3.max(pts, p => p.y);
  const offset = { x: body.bounds.min.x - body.position.x - minX, y: body.bounds.min.y - body.position.y - minY };

  body.county = { id: c.id, name: c.name, value, path, offset, w: maxX - minX, h: maxY - minY, mode,
    morphPts: resample(outer, CONFIG.morphPoints) };
  return body;
}

// ---------- One physics world per side ----------

function createSim(side, sectionEl) {
  const stage = sectionEl.querySelector(".stage");
  const canvas = stage.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  const engine = Engine.create({ positionIterations: 10, velocityIterations: 8, enableSleeping: true });
  const runner = Runner.create({ isFixed: true, delta: 1000 / 60 });
  let W = 0, H = 0, dpr = 1;
  let walls = [], bodies = [], live = [], timer = null, results = null, scaleK = 0;

  const mouse = Mouse.create(canvas);
  for (const evt of ["mousewheel", "DOMMouseScroll", "wheel"]) canvas.removeEventListener(evt, mouse.mousewheel);
  const mouseConstraint = MouseConstraint.create(engine, {
    mouse, constraint: { stiffness: 0.2, damping: 0.1, render: { visible: false } }
  });
  Composite.add(engine.world, mouseConstraint);
  let pointerInside = false;
  canvas.addEventListener("pointerenter", () => (pointerInside = true));
  canvas.addEventListener("pointerleave", () => (pointerInside = false));

  const wakeAll = () => live.forEach(b => Sleeping.set(b, false));

  Events.on(engine, "afterUpdate", () => {
    for (const b of live) {
      const p = b.position;
      if (p.y > H + 300 || p.x < -300 || p.x > W + 300) {
        Body.setPosition(b, { x: W / 2, y: -b.county.h });
        Body.setVelocity(b, { x: 0, y: 0 });
      }
    }
  });

  function buildWalls() {
    Composite.remove(engine.world, walls);
    const T = 400, opts = { isStatic: true, friction: 0.8 };
    walls = [
      Bodies.rectangle(W / 2, H + T / 2, W + 2 * T, T, opts),
      Bodies.rectangle(-T / 2, -H, T, 4 * H + 2 * T, opts),
      Bodies.rectangle(W + T / 2, -H, T, 4 * H + 2 * T, opts),
      Bodies.rectangle(W / 2, -3 * H - T / 2, W + 2 * T, T, opts)
    ];
    Composite.add(engine.world, walls);
    wakeAll();
  }

  function resize() {
    W = stage.clientWidth; H = stage.clientHeight; dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    Mouse.setScale(mouse, { x: 1 / dpr, y: 1 / dpr });
    buildWalls();
  }

  function drop(res, k) {
    results = res;
    clearInterval(timer);
    Composite.remove(engine.world, bodies);
    scaleK = k;
    bodies = [];
    live = [];
    const queue = COUNTIES
      .map(c => ({ c, value: res.byId.get(c.id)?.[side] ?? 0 }))
      .filter(d => d.value > 0)
      .sort((a, b) => b.value - a.value); // largest first, lands on the bottom
    let i = 0;
    timer = setInterval(() => {
      if (i >= queue.length) return clearInterval(timer);
      const { c, value } = queue[i++];
      const b = buildCountyBody(c, value, k); // built at drop time, in the current shape mode
      bodies.push(b);
      const half = Math.max(b.county.w, b.county.h) / 2;
      Body.setPosition(b, { x: half + Math.random() * Math.max(1, W - 2 * half), y: -half - 20 });
      Body.setAngle(b, (Math.random() - 0.5) * 0.6);
      Composite.add(engine.world, b);
      live.push(b);
    }, CONFIG.dropIntervalMs);
  }

  // Swap every settled or moving body for the same county in the other shape,
  // keeping its position and velocity so the pile stays put.
  function morph(mode) {
    const swapped = live.map(old => {
      const c = COUNTY_BY_ID.get(old.county.id);
      const b = buildCountyBody(c, old.county.value, scaleK, mode);
      Body.setPosition(b, old.position);
      Body.setVelocity(b, old.velocity);
      Body.setAngle(b, old.angle);
      // Animate the drawn shape from the old outline to the new one, in the
      // body's own frame (point + offset = position relative to centre of mass)
      const toLocal = (pts, off) => pts.map(([x, y]) => [x + off.x, y + off.y]);
      const from = toLocal(old.county.morphPts, old.county.offset);
      const to = alignTo(from, toLocal(b.county.morphPts, b.county.offset));
      b.county.tween = { from, to, start: performance.now(), dur: CONFIG.morphMs };
      Composite.remove(engine.world, old);
      Composite.add(engine.world, b);
      return b;
    });
    bodies = bodies.map(b => swapped.find(s => s.county.id === b.county.id) ?? b);
    live = swapped;
    wakeAll();
  }

  function shake() {
    const s = CONFIG.shakeStrength;
    for (const b of live) {
      Sleeping.set(b, false);
      Body.setVelocity(b, { x: (Math.random() - 0.5) * 12 * s, y: (-6 - Math.random() * 12) * s });
      Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.15 * s);
    }
  }

  function setGravity(on) {
    engine.gravity.y = on ? 1 : 0;
    wakeAll();
  }

  // The county under this side's pointer (or being dragged here), if any
  function pick() {
    const hovered = pointerInside ? Query.point(live, mouse.position)[0] : null;
    const active = mouseConstraint.body?.county ? mouseConstraint.body : hovered;
    canvas.style.cursor = mouseConstraint.body ? "grabbing" : hovered ? "grab" : "default";
    return active ? active.county.id : null;
  }

  function tooltip(text, anchorX, anchorY, colors) {
    ctx.font = '600 13px "Barlow", system-ui, sans-serif';
    const tw = ctx.measureText(text).width + 16;
    const x = Math.min(Math.max(anchorX, 4), W - tw - 4);
    const y = Math.min(Math.max(anchorY, 4), H - 28);
    ctx.fillStyle = colors.ink;
    ctx.beginPath();
    ctx.roundRect(x, y, tw, 24, 5);
    ctx.fill();
    ctx.fillStyle = colors.paper;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x + 8, y + 12);
  }

  // highlightId: county to light up on this side; isSource: whether the pointer is on this side
  function draw(colors, highlightId, isSource) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const active = highlightId ? live.find(b => b.county.id === highlightId) : null;
    const fillA = colors[side], fillB = colors[`${side}-2`];
    ctx.lineJoin = "round";
    const now = performance.now();
    live.forEach((b, i) => {
      const { offset, tween } = b.county;
      let path = b.county.path;
      ctx.save();
      ctx.translate(b.position.x, b.position.y);
      ctx.rotate(b.angle);
      if (tween) {
        const t = Math.min(1, (now - tween.start) / tween.dur);
        if (t >= 1) {
          delete b.county.tween;
          ctx.translate(offset.x, offset.y);
        } else {
          // Interpolated outline, already in the body's frame
          const e = easeInOut(t);
          path = new Path2D();
          tween.from.forEach(([x0, y0], j) => {
            const [x1, y1] = tween.to[j];
            const x = x0 + (x1 - x0) * e, y = y0 + (y1 - y0) * e;
            j ? path.lineTo(x, y) : path.moveTo(x, y);
          });
          path.closePath();
        }
      } else {
        ctx.translate(offset.x, offset.y);
      }
      ctx.fillStyle = b === active ? colors.active : i % 2 ? fillB : fillA;
      ctx.fill(path, "evenodd");
      ctx.lineWidth = 1;
      ctx.strokeStyle = colors.line;
      ctx.stroke(path);
      ctx.restore();
    });

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = '600 12px "Barlow", system-ui, sans-serif';
    for (const b of live) {
      const { w, h, name } = b.county;
      if (Math.min(w, h) < CONFIG.minLabelPx) continue;
      ctx.lineWidth = 3;
      ctx.strokeStyle = colors.paper;
      ctx.strokeText(name, b.position.x, b.position.y);
      ctx.fillStyle = colors.ink;
      ctx.fillText(name, b.position.x, b.position.y);
    }

    if (active && results) {
      const r = results.byId.get(active.county.id);
      const share = r.yes + r.no ? active.county.value / (r.yes + r.no) : 0;
      const text = countyLabel(active.county.name, side, active.county.value, share);
      if (isSource) {
        // Next to the pointer
        const above = mouse.position.y - 34;
        tooltip(text, mouse.position.x + 14, above < 4 ? mouse.position.y + 18 : above, colors);
      } else {
        // Pinned above the matching county (hover from the other container or from the table)
        ctx.font = '600 13px "Barlow", system-ui, sans-serif';
        const tw = ctx.measureText(text).width + 16;
        const top = active.bounds.min.y - 30;
        tooltip(text, active.position.x - tw / 2, top < 4 ? active.bounds.max.y + 6 : top, colors);
      }
    }
  }

  Runner.run(runner, engine);
  return { side, resize, drop, morph, shake, setGravity, pick, draw, area: () => W * H };
}

// ---------- Page ----------

const sims = ["yes", "no"].map(side =>
  createSim(side, document.querySelector(`.side[data-side="${side}"]`)));
let current = null;
let colors = {};

function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["ink", "paper", "line", "active", "yes", "yes-2", "no", "no-2"]) {
    colors[k] = cs.getPropertyValue(`--${k}`).trim();
  }
}

let sizeFactor = 1;

function dropBoth() {
  if (!current) return;
  const { totals } = current;
  // One shared scale: the side with more votes fills `fillRatio` of the smaller stage
  // The size slider scales linear dimensions, so area scales with its square
  const k = (sizeFactor ** 2 * CONFIG.fillRatio * Math.min(...sims.map(s => s.area()))) / Math.max(totals.yes, totals.no);
  sims.forEach(s => s.drop(current, k));
}

function showResults(res, title) {
  current = res;
  document.getElementById("title").textContent = title;
  const all = res.totals.yes + res.totals.no;
  for (const side of ["yes", "no"]) {
    document.getElementById(`total-${side}`).textContent =
      `${fmt(res.totals[side])} votes, ${pct(all ? res.totals[side] / all : 0)}`;
  }
  const notes = [];
  if (res.unmatched.length) notes.push(`Rows not matched to a county: ${res.unmatched.join(", ")}.`);
  if (res.missing.length) notes.push(`Counties with no data: ${res.missing.join(", ")}.`);
  msg(notes.join(" "));
  setTableData(res);
  dropBoth();
}

const sizeInput = document.getElementById("size");
const sizeOut = document.getElementById("size-out");
sizeInput.addEventListener("input", () => {
  sizeOut.textContent = `${Math.round(sizeInput.value * 100)}%`; // live readout; re-drop on release
});
sizeInput.addEventListener("change", () => {
  sizeFactor = Number(sizeInput.value);
  dropBoth();
});
document.getElementById("drop").addEventListener("click", dropBoth);
document.getElementById("shake").addEventListener("click", () => sims.forEach(s => s.shake()));
const shapeBtn = document.getElementById("shape");
shapeBtn.addEventListener("click", () => {
  shapeMode = shapeMode === "map" ? "circle" : "map";
  shapeBtn.setAttribute("aria-pressed", String(shapeMode === "circle"));
  shapeBtn.textContent = shapeMode === "circle" ? "Show map shapes" : "Show as circles";
  sims.forEach(s => s.morph(shapeMode));
});
const gravityBtn = document.getElementById("gravity");
gravityBtn.addEventListener("click", () => {
  const on = gravityBtn.getAttribute("aria-pressed") !== "true";
  gravityBtn.setAttribute("aria-pressed", String(on));
  gravityBtn.textContent = on ? "Gravity on" : "Gravity off";
  sims.forEach(s => { s.setGravity(on); if (!on) s.shake(); });
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { sims.forEach(s => s.resize()); fitSegLabels(); }, 150);
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);

function frame() {
  // Whichever side the pointer is on drives the highlight on both sides
  const picks = sims.map(s => s.pick());
  const source = picks.findIndex(id => id !== null);
  // A pointer on a canvas wins; otherwise use the county hovered in the table
  const id = source >= 0 ? picks[source] : tableHoverId;
  sims.forEach((s, i) => s.draw(colors, id, i === source));
  requestAnimationFrame(frame);
}

readColors();
sims.forEach(s => s.resize());

const measureSelect = document.getElementById("measure");
let measureData = null;

function showMeasure(key, { updateUrl = true } = {}) {
  const m = measureData.measures.find(x => x.key === key) ?? measureData.measures[0];
  measureSelect.value = m.key;
  document.getElementById("snapshot-note").textContent =
    `${measureData.election}. ${m.precinctsReportingPercent}% of precincts reporting as of ${measureData.snapshot}.`;
  showResults(measureToResults(m), m.title);
  if (updateUrl) {
    const url = new URL(location.href);
    url.searchParams.set("measure", m.key);
    history.replaceState(null, "", url);
  }
}

measureSelect.addEventListener("change", () => showMeasure(measureSelect.value));

function loadMeasures() {
  measureData = window.BALLOT_MEASURES;
  if (!measureData?.measures?.length) {
    msg("Couldn’t load data/ballot-measures.js. Run node scripts/build-ballot-measures.mjs to generate it.");
    return;
  }
  for (const m of measureData.measures) measureSelect.add(new Option(m.title, m.key));
  measureSelect.disabled = false;
  showMeasure(new URLSearchParams(location.search).get("measure"), { updateUrl: false });
}
loadMeasures();
requestAnimationFrame(frame);
</script>
</body>
