<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colorado counties, under gravity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef0ea;
    --ink: #22302a;
    --muted: #5d6b63;
    --fill: #7f9c86;
    --fill-2: #94ae9a;
    --stroke: #2f4a3a;
    --hover: #c9a227;
    --floor: #d9ded5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #18201c;
      --ink: #e4e9e3;
      --muted: #9aa89f;
      --fill: #4f6d58;
      --fill-2: #5e7d67;
      --stroke: #a9c3b0;
      --hover: #d9b440;
      --floor: #222c27;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font: 400 1rem/1.4 "Barlow", system-ui, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: .75rem 2rem;
    padding: 1rem clamp(1rem, 3vw, 2rem) .75rem;
  }
  h1 {
    font: 600 clamp(1.4rem, 3vw, 2rem)/1.1 "Barlow Condensed", "Barlow", sans-serif;
    margin: 0;
  }
  header p { margin: .2rem 0 0; color: var(--muted); font-size: .95rem; }
  .controls { display: flex; gap: .5rem; margin-left: auto; }
  button {
    font: 600 .9rem "Barlow", system-ui, sans-serif;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--stroke);
    border-radius: 6px;
    padding: .4rem .8rem;
    cursor: pointer;
  }
  button:hover { background: var(--floor); }
  button:focus-visible { outline: 2px solid var(--hover); outline-offset: 2px; }
  button[aria-pressed="false"] { color: var(--muted); border-style: dashed; }
  #stage {
    flex: 1;
    position: relative;
    min-height: 320px;
    margin: 0 clamp(1rem, 3vw, 2rem) clamp(1rem, 3vw, 2rem);
    border: 1.5px solid var(--stroke);
    border-radius: 8px;
    overflow: hidden;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #status { position: absolute; inset: 1rem; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Colorado counties, under gravity</h1>
      <p>Each county’s area is proportional to its 2020 Census population. Drag them around.</p>
    </div>
    <div class="controls">
      <button id="drop" type="button">Drop again</button>
      <button id="shake" type="button">Shake</button>
      <button id="gravity" type="button" aria-pressed="true">Gravity on</button>
    </div>
  </header>
  <div id="stage">
    <div id="status">Loading…</div>
    <canvas id="canvas"></canvas>
  </div>

  dropIntervalMs: 70,
  // restitution 0 = no bounce; slop = allowed overlap before correction (higher = less jitter)
  body: { friction: 0.6, frictionStatic: 1, frictionAir: 0.02, restitution: 0, slop: 0.1 },
  shakeStrength: 1       // multiplier for the Shake button
};

const { Engine, Runner, Bodies, Body, Composite, Mouse, MouseConstraint, Query, Vertices, Common, Events, Sleeping } = Matter;
Common.setDecomp(decomp);

const stage = document.getElementById("stage");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, dpr = 1;
let colors = {};

// ---------- Data prep (once) ----------

function loadCounties() {
  const topo = JSON.parse(document.getElementById("colorado-topo").textContent);
  const fc = topojson.feature(topo, topo.objects["colorado-counties"]);
  const projection = d3.geoConicEqualArea()
    .parallels([37.5, 40.5]).rotate([105.5, 0]).fitSize([1000, 1000], fc);
  const path = d3.geoPath(projection);

  return fc.features.map(f => {
    const [name, pop] = POPULATION_2020[f.id];
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    // Projected rings, open (drop GeoJSON's repeated closing point)
    const rings = polys.map(poly => poly.map(ring => ring.slice(0, -1).map(projection)));
    return { id: f.id, name, pop, rings, projArea: path.area(f) };
  }).sort((a, b) => b.pop - a.pop);
}

const ringArea = r => Math.abs(d3.polygonArea(r));

// Douglas–Peucker on an open ring of [x, y] points
function simplify(points, tol) {
  if (points.length < 8) return points;
  const keep = new Uint8Array(points.length);
  keep[0] = keep[points.length - 1] = 1;
  const stack = [[0, points.length - 1]];
  const t2 = tol * tol;
  while (stack.length) {
    const [a, b] = stack.pop();
    const [ax, ay] = points[a], [bx, by] = points[b];
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy || 1;
    let maxD = 0, idx = -1;
    for (let i = a + 1; i < b; i++) {
      const [px, py] = points[i];
      const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
      const ex = ax + t * dx - px, ey = ay + t * dy - py;
      const d = ex * ex + ey * ey;
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (maxD > t2) { keep[idx] = 1; stack.push([a, idx], [idx, b]); }
  }
  const out = points.filter((_, i) => keep[i]);
  return out.length >= 3 ? out : points;
}

// ---------- Bodies ----------

function buildCountyBody(c, k) {
  const s = Math.sqrt((c.pop * k) / c.projArea);
  const rings = c.rings.map(poly => poly.map(ring => ring.map(([x, y]) => [x * s, y * s])));

  // Render path: every polygon and hole, full detail
  const path = new Path2D();
  for (const poly of rings) for (const ring of poly) {
    path.moveTo(ring[0][0], ring[0][1]);
    for (let i = 1; i < ring.length; i++) path.lineTo(ring[i][0], ring[i][1]);
    path.closePath();
  }

  // Collision shape: largest exterior ring, simplified
  const outer = rings.map(p => p[0]).sort((a, b) => ringArea(b) - ringArea(a))[0];
  const pts = simplify(outer, CONFIG.simplifyPx).map(([x, y]) => ({ x, y }));
  const polyArea = ringArea(outer);
  const clone = () => pts.map(p => ({ x: p.x, y: p.y }));

  let body = null;
  if (polyArea > 250 && !Vertices.isConvex(clone())) {
    try { body = Bodies.fromVertices(0, 0, [clone()], { ...CONFIG.body }, true, 0.01, 1); } catch { body = null; }
    const partsArea = body ? (body.parts.length > 1 ? d3.sum(body.parts.slice(1), p => p.area) : body.area) : 0;
    if (partsArea < 0.85 * polyArea) body = null; // decomposition dropped too much; fall back
  }
  if (!body) body = Bodies.fromVertices(0, 0, [Vertices.hull(clone())], { ...CONFIG.body });

  // Offset from the body's centre of mass to the outline's coordinate frame
  const minX = d3.min(pts, p => p.x), minY = d3.min(pts, p => p.y);
  const maxX = d3.max(pts, p => p.x), maxY = d3.max(pts, p => p.y);
  const offset = { x: body.bounds.min.x - body.position.x - minX, y: body.bounds.min.y - body.position.y - minY };

  body.county = { ...c, path, offset, w: maxX - minX, h: maxY - minY };
  return body;
}

// ---------- World ----------

// Sleeping freezes bodies that have settled, which stops resting jitter
const engine = Engine.create({ positionIterations: 10, velocityIterations: 8, enableSleeping: true });
// Fixed timestep keeps the solver stable regardless of frame rate
const runner = Runner.create({ isFixed: true, delta: 1000 / 60 });
let countyBodies = []; // all bodies for the current drop
let live = [];         // bodies that have entered the world
let walls = [];
let dropTimer = null;
const counties = loadCounties();

function buildWalls() {
  Composite.remove(engine.world, walls);
  const T = 400, opts = { isStatic: true, friction: 0.8 };
  walls = [
    Bodies.rectangle(W / 2, H + T / 2, W + 2 * T, T, opts),                  // floor
    Bodies.rectangle(-T / 2, -H, T, 4 * H + 2 * T, opts),                    // left
    Bodies.rectangle(W + T / 2, -H, T, 4 * H + 2 * T, opts),                 // right
    Bodies.rectangle(W / 2, -3 * H - T / 2, W + 2 * T, T, opts)              // ceiling, far above
  ];
  Composite.add(engine.world, walls);
  for (const b of live) Sleeping.set(b, false); // let them resettle against the new walls
}

function dropAll() {
  clearInterval(dropTimer);
  Composite.remove(engine.world, countyBodies);
  const totalPop = d3.sum(counties, c => c.pop);
  const k = (CONFIG.fillRatio * W * H) / totalPop; // px² per person
  countyBodies = counties.map(c => buildCountyBody(c, k));
  live = [];

  // Largest first, so the big counties land on the bottom
  let i = 0;
  dropTimer = setInterval(() => {
    if (i >= countyBodies.length) return clearInterval(dropTimer);
    const b = countyBodies[i++];
    const { w, h } = b.county;
    const half = Math.max(w, h) / 2;
    Body.setPosition(b, { x: half + Math.random() * Math.max(1, W - 2 * half), y: -half - 20 });
    Body.setAngle(b, (Math.random() - 0.5) * 0.6);
    Composite.add(engine.world, b);
    live.push(b);
  }, CONFIG.dropIntervalMs);
}

function shake() {
  const s = CONFIG.shakeStrength;
  for (const b of live) {
    Sleeping.set(b, false);
    Body.setVelocity(b, { x: (Math.random() - 0.5) * 12 * s, y: (-6 - Math.random() * 12) * s });
    Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.15 * s);
  }
}

// Anything that tunnels out of the box gets put back at the top
Events.on(engine, "afterUpdate", () => {
  for (const b of live) {
    const p = b.position;
    if (p.y > H + 300 || p.x < -300 || p.x > W + 300) {
      Body.setPosition(b, { x: W / 2, y: -b.county.h });
      Body.setVelocity(b, { x: 0, y: 0 });
    }
  }
});

// ---------- Input ----------

const mouse = Mouse.create(canvas);
// Matter ignores wheel scrolling here; let the page handle it
for (const evt of ["mousewheel", "DOMMouseScroll", "wheel"]) canvas.removeEventListener(evt, mouse.mousewheel);
const mouseConstraint = MouseConstraint.create(engine, {
  mouse,
  constraint: { stiffness: 0.2, damping: 0.1, render: { visible: false } }
});
Composite.add(engine.world, mouseConstraint);
let pointerInside = false;
canvas.addEventListener("pointerenter", () => (pointerInside = true));
canvas.addEventListener("pointerleave", () => (pointerInside = false));

// ---------- Sizing ----------

function resize() {
  // clientWidth/Height exclude the border, matching the canvas's drawable area
  W = stage.clientWidth; H = stage.clientHeight; dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  // Matter's mouse reads canvas pixels; map back to CSS px
  Mouse.setScale(mouse, { x: 1 / dpr, y: 1 / dpr });
  buildWalls();
}

function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["ink", "muted", "fill", "fill-2", "stroke", "hover", "paper"]) colors[k] = cs.getPropertyValue(`--${k}`).trim();
}

// ---------- Render ----------

const fmt = d3.format(",");

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const hovered = pointerInside ? Query.point(live, mouse.position)[0] : null;
  const active = mouseConstraint.body?.county ? mouseConstraint.body : hovered;
  canvas.style.cursor = mouseConstraint.body ? "grabbing" : hovered ? "grab" : "default";

  ctx.lineJoin = "round";
  live.forEach((b, i) => {
    const { path, offset } = b.county;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    ctx.translate(offset.x, offset.y);
    ctx.fillStyle = b === active ? colors.hover : i % 2 ? colors["fill-2"] : colors.fill;
    ctx.fill(path, "evenodd");
    ctx.lineWidth = 1;
    ctx.strokeStyle = colors.stroke;
    ctx.stroke(path);
    ctx.restore();
  });

  // Labels stay upright at each county's centre of mass
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = '600 12px "Barlow", system-ui, sans-serif';
  for (const b of live) {
    const { w, h, name } = b.county;
    if (Math.min(w, h) < CONFIG.minLabelPx) continue;
    ctx.lineWidth = 3;
    ctx.strokeStyle = colors.paper;
    ctx.strokeText(name, b.position.x, b.position.y);
    ctx.fillStyle = colors.ink;
    ctx.fillText(name, b.position.x, b.position.y);
  }

  // Tooltip for the hovered or dragged county
  if (active) {
    const text = `${active.county.name} County · ${fmt(active.county.pop)}`;
    ctx.font = '600 13px "Barlow", system-ui, sans-serif';
    const tw = ctx.measureText(text).width + 16;
    const x = Math.min(Math.max(mouse.position.x + 14, 4), W - tw - 4);
    const y = Math.max(mouse.position.y - 34, 4);
    ctx.fillStyle = colors.ink;
    ctx.beginPath();
    ctx.roundRect(x, y, tw, 24, 5);
    ctx.fill();
    ctx.fillStyle = colors.paper;
    ctx.textAlign = "left";
    ctx.fillText(text, x + 8, y + 12);
  }

  requestAnimationFrame(draw);
}

// ---------- Wire up ----------

document.getElementById("drop").addEventListener("click", dropAll);
document.getElementById("shake").addEventListener("click", shake);
const gravityBtn = document.getElementById("gravity");
gravityBtn.addEventListener("click", () => {
  const on = gravityBtn.getAttribute("aria-pressed") !== "true";
  gravityBtn.setAttribute("aria-pressed", String(on));
  gravityBtn.textContent = on ? "Gravity on" : "Gravity off";
  engine.gravity.y = on ? 1 : 0;
  for (const b of live) Sleeping.set(b, false);
  if (!on) shake(); // give them a nudge so they float
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 150);
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);

document.getElementById("status").remove();
readColors();
resize();
dropAll();
Runner.run(runner, engine);
requestAnimationFrame(draw);
</script>
</body>
</html>
